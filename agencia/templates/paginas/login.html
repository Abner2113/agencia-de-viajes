{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            border-radius: 16px 16px 0 0 !important;
            background: #0d6efd;
        }

        .btn-primary {
            background: #0d6efd;
            border: none;
            padding: 10px;
            font-size: 1rem;
        }

        .btn-primary:hover {
            background: #0a58ca;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card">
                    <!-- Header -->
                    <div class="card-header text-white text-center py-4">
                        <i class="bi bi-airplane-fill fs-1"></i>
                        <h4 class="mt-2 mb-0">Agencia de Viajes</h4>
                        <small class="opacity-75">Panel de empleados</small>
                    </div>

                    <!-- Body -->
                    <div class="card-body p-4">

                        {% if error %}
                        <div class="alert alert-danger d-flex align-items-center">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            {{ error }}
                        </div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}

                            <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                    <i class="bi bi-envelope me-1"></i>Correo electrónico
                                </label>
                                {{ formulario.username }}
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    <i class="bi bi-lock me-1"></i>Contraseña
                                </label>
                                {{ formulario.password }}
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                                </button>
                            </div>
                        </form>

                    </div>

                    <!-- Footer -->
                    <div class="card-footer text-center text-muted py-3">
                        <small><i class="bi bi-shield-lock me-1"></i>Acceso exclusivo para empleados</small>
                        <div class="mt-2">
                            <a href="{% url 'inicio' %}" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-arrow-left me-1"></i>Volver al inicio
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
