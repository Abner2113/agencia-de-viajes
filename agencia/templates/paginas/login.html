{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Wanderlust</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="{% static 'agencia/css/login.css' %}" rel="stylesheet" />
</head>
<body>
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
    <div class="bubble bubble-3"></div>
    <div class="bubble bubble-4"></div>
    
    <div class="login-right">
        <div class="login-box">

            <!-- Brand -->
            <div class="login-brand">
                <div class="brand-icon"><i class="bi bi-airplane-fill"></i></div>
                <span class="brand-name">Agencia de Viajes</span>
            </div>

            <div class="login-title">¡Bienvenido! </div>
            <div class="login-sub">Ingresa a tu cuenta para continuar</div>

            <!-- Error -->
            {% if error %}
            <div class="error-box">
                <i class="bi bi-exclamation-circle-fill"></i> {{ error }}
            </div>
            {% endif %}

            <!-- Formulario -->
            <form method="post">
                {% csrf_token %}

                <div class="mb-1">
                    <label class="form-label">Usuario o correo</label>
                </div>
                <div class="input-group-custom">
                    <i class="bi bi-person-fill input-icon"></i>
                    {{ formulario.username }}
                </div>

                <div class="mb-1 mt-2">
                    <label class="form-label">Contraseña</label>
                </div>
                <div class="input-group-custom">
                    <i class="bi bi-lock-fill input-icon"></i>
                    {{ formulario.password }}
                </div>

                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right"></i> Entrar
                </button>
            </form>

            <div class="divider"><span>o</span></div>

            <div class="login-footer">
                <p><i class="bi bi-shield-check"></i> Solo para empleados de la agencia</p>
                <a href="{% url 'inicio' %}" class="btn-back">
                    <i class="bi bi-arrow-left"></i> Volver al inicio
                </a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
