<form method="post">
    {% csrf_token %}
    {% for campo in form %}
    <div class="mb-3">
        <label for="{{ campo.id_for_label }}" class="form-label">{{ campo.label }}:</label>
        {{ campo }}
        {% if campo.errors %}
        <div class="text-danger small">{{ campo.errors }}</div>
        {% endif %}
    </div>
    {% endfor %}

    <input class="btn btn-success" type="submit" value="Enviar información" />
    <a class="btn btn-danger" href="{% url 'comentarios_paquete' id=paquete.id %}" role="button">Cancelar</a>
</form>
