<form method="post">
    {% csrf_token %}
    {% for campo in form %}
    <div class="mb-3">
        <label for="{{ campo.id_for_label }}" class="form-label">{{ campo.label }}:</label>

        {% if campo.name == 'permissions' %}
        <div class="border rounded p-3" style="max-height: 350px; overflow-y: auto;">
            {{ campo }}
        </div>
        {% else %}
        {{ campo }}
        {% endif %}

        {% if campo.errors %}
        <div class="text-danger small">
            {{ campo.errors }}
        </div>
        {% endif %}
    </div>
    {% endfor %}

    <input class="btn btn-success" type="submit" value="Enviar información" />
    <a class="btn btn-primary" href="{% url 'roles' %}" role="button">Cancelar</a>
</form>
